# Shared machine-readable policy contract.
#
# SAFE_BASELINE_TTL_SECONDS is declared exactly once, here, and resolved by both
# runtimes: the Rust hot path scans this file at compile time (include_str! plus
# a const fn) and the Python warm path reads it at import. Do not repeat the
# assignment in any other file; scripts/check_contract_single_source.py fails
# and names the duplicate if one appears.
SAFE_BASELINE_TTL_SECONDS=900
