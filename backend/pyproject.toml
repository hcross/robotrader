[project]
name = "robotrader"
version = "0.1.0"
description = "Multi-agent crypto trading bot"
authors = [
    {name = "Robotrader Team"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "litellm (>=1.80.10,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "ccxt (>=4.5.28,<5.0.0)",
    "solana (>=0.36.10,<0.37.0)",
    "fastapi (>=0.126.0,<0.127.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "websockets (>=15.0.1,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
