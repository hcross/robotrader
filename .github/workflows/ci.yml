name: CI

on:
  pull_request:
    paths:
      - "engine-rs/**"
      - "backend/**"
      - "frontend/**"
      - "Dockerfile*"
      - "docker-compose.yml"
  push:
    branches: [master]
    paths:
      - "engine-rs/**"
      - "backend/**"
      - "frontend/**"
      - "Dockerfile*"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - name: cargo test
        working-directory: engine-rs
        run: cargo test --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install poetry
          poetry install --no-root
      - name: Architecture and unit tests
        working-directory: backend
        run: |
          PYTHONPATH=.. poetry run python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
